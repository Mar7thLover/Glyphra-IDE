<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Glyphra</title>
    <script>
      // Apply persisted theme before first paint to avoid a flash.
      (function () {
        var t = localStorage.getItem("glyphra.theme");
        if (t !== "light" && t !== "dark") {
          t = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        }
        document.documentElement.dataset.theme = t;
        var v = localStorage.getItem("glyphra.themeVariant");
        document.documentElement.dataset.variant =
          v === "soft" || v === "contrast" ? v : "neutral";
        // Assume Mica until the backend reports otherwise (avoids opaque->transparent pop).
        document.documentElement.dataset.mica = "true";
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
