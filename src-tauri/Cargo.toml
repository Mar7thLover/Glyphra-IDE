[package]
name = "glyphra"
version = "0.1.0"
description = "Agent-first, feather-light code studio"
authors = ["Glyphra contributors"]
edition = "2021"
license = "MIT"

[lib]
name = "glyphra_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-util", "process", "sync", "time", "fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2"
ts-rs = { version = "11", features = ["serde-compat"] }
notify = "8"
sysinfo = "0.35"

[target.'cfg(windows)'.dependencies]
windows-version = "0.1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
