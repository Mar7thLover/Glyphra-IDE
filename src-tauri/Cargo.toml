[package]
name = "glyphra"
version = "0.2.0"
description = "Agent-first, feather-light code studio for reviewing and steering AI-written code"
authors = ["Glyphra contributors"]
edition = "2021"
license = "MIT"

[lib]
name = "glyphra_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2.10"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-util", "process", "sync", "time", "fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
thiserror = "2"
ts-rs = { version = "11", features = ["serde-compat"] }
notify = "8"
sysinfo = "0.35"
keyring = { version = "3", features = ["apple-native", "windows-native", "linux-native-sync-persistent"] }
uuid = { version = "1", features = ["v4", "serde"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
portable-pty = "0.9.0"
grep = "0.4.1"
ignore = "0.4.30"
encoding_rs = "0.8"
chardetng = "0.1"
editorconfig-parser = "0.0.4"
url = "2"
zip = { version = "4.3", default-features = false, features = ["deflate"] }
tempfile = "3"

[target.'cfg(windows)'.dependencies]
win32job = "2.0.3"
windows = { version = "0.61", features = ["Win32_System_Threading", "Win32_Foundation"] }
windows-version = "0.1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
