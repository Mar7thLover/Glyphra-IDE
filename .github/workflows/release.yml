name: release

# Build installers for Windows / macOS / Linux and publish a GitHub Release.
# Triggers:
#   - push of a version tag: v0.2.0
#   - manual workflow_dispatch (uses version from tauri.conf.json)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      prerelease:
        description: "Mark the GitHub Release as a prerelease"
        required: true
        default: true
        type: boolean
      draft:
        description: "Create the GitHub Release as a draft"
        required: true
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      app_version: ${{ steps.meta.outputs.app_version }}
      is_prerelease: ${{ steps.meta.outputs.is_prerelease }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
        with:
          version: 11.8.0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify version sync
        run: pnpm check:version
      - id: meta
        name: Resolve release metadata
        shell: bash
        run: |
          VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          echo "app_version=$VERSION" >> "$GITHUB_OUTPUT"
          if [[ "$VERSION" == *-* ]]; then
            echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
          fi
          echo "Glyphra version: $VERSION"

  publish-tauri:
    needs: version
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target aarch64-apple-darwin
            label: macos-aarch64
          - platform: macos-latest
            args: --target x86_64-apple-darwin
            label: macos-x86_64
          - platform: ubuntu-22.04
            args: ""
            label: linux-x86_64
          - platform: windows-latest
            args: "--bundles nsis,msi"
            label: windows-x86_64

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v5

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            xdg-utils

      - uses: pnpm/action-setup@v5
        with:
          version: 11.8.0

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
          shared-key: release-${{ matrix.label }}

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and upload release assets
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: Glyphra v__VERSION__
          releaseBody: |
            ## Glyphra v__VERSION__

            See [CHANGELOG.md](https://github.com/Mar7thLover/Glyphra-IDE/blob/main/CHANGELOG.md) for what changed in this release.

            ### Downloads
            | Platform | Installer |
            | --- | --- |
            | Windows x64 | `.exe` NSIS installer, `.msi`, and portable `.exe` |
            | macOS Apple Silicon | `.dmg` / `.app` (`aarch64-apple-darwin`) |
            | macOS Intel | `.dmg` / `.app` (`x86_64-apple-darwin`) |
            | Linux x64 | `.AppImage`, `.deb`, `.rpm` |

            ### Notes
            - Agent CLIs (Codex, Claude Code, Pi, OpenCode, …) are **not** bundled — install them separately; Glyphra auto-detects them on `PATH`.
            - Builds are **unsigned** in v0.x. On Windows, SmartScreen may warn; on macOS, right-click → Open the first time.
            - See [docs/releasing.md](https://github.com/Mar7thLover/Glyphra-IDE/blob/main/docs/releasing.md) for the release pipeline.

            ### Verify
            After install, open Glyphra and confirm **Settings → About** shows this version.
          releaseDraft: ${{ github.event_name == 'workflow_dispatch' && inputs.draft || false }}
          prerelease: ${{ github.event_name != 'workflow_dispatch' && needs.version.outputs.is_prerelease == 'true' || github.event_name == 'workflow_dispatch' && inputs.prerelease }}
          args: ${{ matrix.args }}
          # Windows portable-style binary; macOS/Linux GUI apps still need their installers.
          uploadPlainBinary: true
          uploadUpdaterJson: true
          updaterJsonPreferNsis: true
          projectPath: .

      - name: Verify Windows installer artifacts
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: ./scripts/verify-windows-bundle.ps1

  publish-update-channel:
    needs: [version, publish-tauri]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download signed updater manifest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release download "v${{ needs.version.outputs.app_version }}" --pattern latest.json
      - name: Validate updater manifest
        run: |
          jq -e '
            (.version | length > 0) and
            (.platforms | type == "object") and
            ([.platforms[] | select((.url | length == 0) or (.signature | length == 0))] | length == 0)
          ' latest.json >/dev/null
      - name: Publish rolling updater channel
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! gh release view updater >/dev/null 2>&1; then
            gh release create updater \
              --title "Glyphra updater channel" \
              --notes "Machine-readable rolling channel for signed Glyphra updates." \
              --prerelease
          fi
          gh release upload updater latest.json --clobber

  summarize:
    needs: [version, publish-tauri, publish-update-channel]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Release summary
        shell: bash
        run: |
          echo "Version: ${{ needs.version.outputs.app_version }}"
          echo "Publish job: ${{ needs.publish-tauri.result }}"
          echo "Updater channel: ${{ needs.publish-update-channel.result }}"
          echo "Tag: v${{ needs.version.outputs.app_version }}"
